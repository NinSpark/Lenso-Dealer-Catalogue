<h2 mat-dialog-title>Register Dealer</h2>

<mat-dialog-content>
    <div>
        <mat-form-field appearance="fill" class="w-100">
            <mat-label>Dealer Code</mat-label>
            <input matInput type="text" placeholder="ABC" id="dealerCode" [(ngModel)]="dealerCode"
                [ngModelOptions]="{standalone: true}" required />
        </mat-form-field>
    </div>
    <div>
        <mat-form-field appearance="fill" class="w-100">
            <mat-label>Company Name</mat-label>
            <input matInput type="text" placeholder="ABC" id="companyName" [(ngModel)]="companyName"
                [ngModelOptions]="{standalone: true}" required />
        </mat-form-field>
    </div>
    <div>
        <mat-form-field appearance="fill" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput type="text" placeholder="ABC" id="email" [(ngModel)]="email"
                [ngModelOptions]="{standalone: true}" required />
        </mat-form-field>
    </div>
    <div>
        <mat-form-field appearance="fill" class="w-100">
            <mat-label>Phone No.</mat-label>
            <input matInput type="text" placeholder="60123456789" id="phone" [(ngModel)]="phone"
                [ngModelOptions]="{standalone: true}" required />
        </mat-form-field>
    </div>
    <div>
        <mat-form-field appearance="fill" class="w-100">
            <mat-label>Username</mat-label>
            <input matInput type="text" placeholder="ABC" id="username" [(ngModel)]="username"
                [ngModelOptions]="{standalone: true}" required />
        </mat-form-field>
    </div>

    <div>
        <mat-form-field appearance="fill" class="w-100">
            <mat-label>Sales Agent</mat-label>
            <mat-select [(ngModel)]="salesAgent" [ngModelOptions]="{standalone: true}" required>
                <mat-option value="CHK">CHK</mat-option>
                <mat-option value="HKJ">HKJ</mat-option>
                <mat-option value="KKK">KKK</mat-option>
                <mat-option value="LKY">LKY</mat-option>
                <mat-option value="LSY">LSY</mat-option>
                <mat-option value="SKW">SKW</mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    <div>
        <mat-form-field appearance="fill" class="w-100">
            <mat-label>Password</mat-label>
            <input matInput type="password" placeholder="Password" id="password" [(ngModel)]="newPassword"
                [ngModelOptions]="{standalone: true}" required />
        </mat-form-field>
    </div>

    <div>
        <mat-form-field appearance="fill" class="w-100">
            <mat-label>Confirm Password</mat-label>
            <input matInput type="password" placeholder="Confirm Password" id="confirm-password"
                [(ngModel)]="confirmNewPassword" [ngModelOptions]="{standalone: true}" required />
        </mat-form-field>
    </div>

    <p *ngIf="changeMessage" class="success">{{ changeMessage }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-flat-button color="primary" (click)="createUser()">Create</button>
    <button mat-flat-button mat-dialog-close>Cancel</button>
</mat-dialog-actions>
