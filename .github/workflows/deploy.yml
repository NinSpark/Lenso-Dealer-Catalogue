name: Deploy Angular Frontend

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Angular
        run: npm run build -- --configuration production --base-href /Lenso-Dealer-Catalogue/

      - name: Check build output
        run: |
          echo "=== Browser build output ==="
          ls -la dist/frontend/browser

      - name: Ensure index.html exists
        run: |
          if [ ! -f dist/frontend/browser/index.html ]; then
            echo "index.html not found. Checking for index.csr.html..."

            if [ -f dist/frontend/browser/index.csr.html ]; then
              cp dist/frontend/browser/index.csr.html dist/frontend/browser/index.html
              echo "Created index.html from index.csr.html"
            else
              echo "ERROR: Neither index.html nor index.csr.html exists!"
              exit 1
            fi
          else
            echo "index.html already exists."
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4